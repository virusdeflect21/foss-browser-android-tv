# AndroidX setup (current, not deprecated)
android.useAndroidX=true
android.enableJetifier=false
android.nonFinalResIds=true
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# Deliberate legacy-behaviour switches. AGP warns that these option settings
# will be removed in AGP 10.0; each one changes build behaviour if flipped,
# so they are kept until a deliberate, tested migration:
#  - enableAppCompileTimeRClass: R class generation mode
#  - r8.optimizedResourceShrinking: release-build resource shrinking behaviour
#  - builtInKotlin: Kotlin toolchain (this project is pure Java)
#  - newDsl: keeps the classic build.gradle DSL used by this project
android.enableAppCompileTimeRClass=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
